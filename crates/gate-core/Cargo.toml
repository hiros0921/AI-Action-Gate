[package]
name = "gate-core"
description = "実行要求を判定する。PII検出・リスクスコアリング・マスキング。I/O を持たない"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 【重要】ここに増やしてよいのは「計算するだけ」のクレートだけ。
# HTTP クライアント・非同期ランタイム・AWS SDK を足したくなったら、
# それは gate-api か gate-store に置くべきものです。
[dependencies]
regex.workspace = true
serde.workspace = true
toml.workspace = true

# 試験でだけ使う。要求の JSON が仕様書の例と一致するかを確かめるため。
[dev-dependencies]
serde_json = "1"
