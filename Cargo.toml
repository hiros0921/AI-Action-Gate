# ワークスペース。判定コアと、あとから足すサーバ・永続化・疑似エージェントを分ける。
#
# 【重要】gate-core には tokio も axum も aws-sdk も入れない。
# 判定ロジックを I/O から独立させるという要件（仕様書4章）を、
# 依存関係の側で守らせる。うっかり混ざったらコンパイルが通らない。
[workspace]
resolver = "3"
members = ["crates/gate-core", "crates/gate-api", "crates/gate-agent", "crates/gate-lab", "crates/gate-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
axum = "0.8"
tokio = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = "1"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
async-trait = "0.1"
